# PIDKiln Simulator Docker Compose
#
# Usage:
#   docker-compose up --build      # Build and start simulator (first time)
#   docker-compose up              # Start simulator
#   docker-compose down            # Stop simulator
#   docker-compose run --rm sim npm <command>  # Run npm commands
#
# Both frontend (../data/) and backend (server.js, mock-data.js) files are
# mounted as volumes. Changes are reflected immediately - just restart the
# container (Ctrl+C, then docker-compose up) for backend changes.
# Frontend changes (HTML/CSS/JS) are live without restart.

services:
  sim:
    build: .
    ports:
      - "3000:3000"
    volumes:
      # Mount the data directory for live frontend development
      - ../data:/frontend:ro
      # Mount simulator source for live backend development (no rebuild needed)
      - ./server.js:/app/server.js:ro
      - ./mock-data.js:/app/mock-data.js:ro
    environment:
      - NODE_ENV=development
      - DATA_DIR=/frontend

